# application.properties
# Runtime configuration for Flight Service: app identity, Postgres connection,
# and JWT settings. All secrets/credentials below have local-dev fallbacks
# via ${VAR:default} - real environments must override them through actual
# environment variables, never by editing the fallback here.

spring.application.name=flight-service

# Fixed per-service port - auth-service is 8081, user-service is 8082,
# hotel-service is 8083, this is the next one, so running multiple services
# natively/side by side never collides.
server.port=${SERVER_PORT:8084}

# Loads .env (KEY=VALUE, properties-format) into Spring's Environment so the
# ${VAR:default} placeholders below pick up real local values.
spring.config.import=optional:file:.env[.properties]

# --- Eureka (service discovery) ---
# Registers this service under its spring.application.name so other services
# can look it up by name instead of a hardcoded host/port. Native default
# reaches Eureka on localhost; docker-compose overrides it to the Compose
# service hostname.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# Registers by IP instead of hostname - on this machine the default hostname
# resolves to a virtual adapter (Windows Mobile Hotspot/ICS) that isn't
# reachable from the Gateway's load balancer, so lb:// routing needs the IP.
eureka.instance.prefer-ip-address=true

# --- Datasource (Postgres) ---
# These values will be fed to the DataSource bean at startup, once the bean
# is built the real TCP connection to Postgres is established.
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:flight_service_db}
spring.datasource.username=${DB_USERNAME:flight_service}
spring.datasource.password=${DB_PASSWORD:flight_service}

# --- JPA / Hibernate ---
# validate: Hibernate only checks the entities match the real schema on
# startup - it never creates/alters tables itself. Flyway (db/migration/*.sql)
# owns the schema instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ----------------- CUSTOM APPLICATION PROPERTIES -----------------
# --- JWT ---
# Must be the EXACT SAME secret as auth-service's app.jwt.secret - this
# service only ever validates tokens auth-service issues, it never signs its
# own. A mismatched secret here would reject every otherwise-valid token.
app.jwt.secret=${JWT_SECRET:flight-service-dev-fallback-secret-please-override-me}
