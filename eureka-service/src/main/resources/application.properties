# application.properties
# Runtime configuration for the Eureka service registry - pure infrastructure,
# no database, no JWT, no business logic. Every other service registers
# itself here and looks up the others by name instead of a hardcoded
# host/port.

spring.application.name=eureka-service

# Fixed port - Netflix Eureka's own convention, unrelated to this project's
# 808x numbering for the actual business services.
server.port=${SERVER_PORT:8761}

# This server is standalone (a single instance, not a cluster of Eureka
# peers) - it shouldn't try to register itself as a client with itself, or
# fetch a registry from a peer that doesn't exist.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
