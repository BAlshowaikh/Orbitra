# application.properties
# Runtime configuration for Booking Service: app identity, Postgres
# connection, JWT settings, and where to reach Hotel/Flight Service. All
# secrets/credentials below have local-dev fallbacks via ${VAR:default} -
# real environments must override them through actual environment
# variables, never by editing the fallback here.

spring.application.name=booking-service

# Fixed per-service port - auth-service is 8081, user-service is 8082,
# hotel-service is 8083, flight-service is 8084, this is the next one.
server.port=${SERVER_PORT:8085}

# Loads .env (KEY=VALUE, properties-format) into Spring's Environment so the
# ${VAR:default} placeholders below pick up real local values.
spring.config.import=optional:file:.env[.properties]

# --- Datasource (Postgres) ---
# These values will be fed to the DataSource bean at startup, once the bean
# is built the real TCP connection to Postgres is established.
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:booking_service_db}
spring.datasource.username=${DB_USERNAME:booking_service}
spring.datasource.password=${DB_PASSWORD:booking_service}

# --- JPA / Hibernate ---
# validate: Hibernate only checks the entities match the real schema on
# startup - it never creates/alters tables itself. Flyway (db/migration/*.sql)
# owns the schema instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ----------------- CUSTOM APPLICATION PROPERTIES -----------------
# --- JWT ---
# Must be the EXACT SAME secret as auth-service's app.jwt.secret - this
# service only ever validates tokens auth-service issues, it never signs its
# own. A mismatched secret here would reject every otherwise-valid token.
app.jwt.secret=${JWT_SECRET:booking-service-dev-fallback-secret-please-override-me}

# --- Inter-service URLs (no Eureka yet - see travel-platform-plan.md for the
#     sequencing decision) ---
# Native default: both services reachable on localhost at their own fixed
# ports. docker-compose overrides these to the Compose service hostnames
# instead (http://hotel-service:8083, http://flight-service:8084).
app.hotel-service.url=${HOTEL_SERVICE_URL:http://localhost:8083}
app.flight-service.url=${FLIGHT_SERVICE_URL:http://localhost:8084}
